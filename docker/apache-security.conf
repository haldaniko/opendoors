ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName localhost

<Directory /var/www/html>
    Options -Indexes

    # Route WordPress permalinks to its front controller while serving real files directly.
    RewriteEngine On
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]

    <FilesMatch "(^\.|^phpinfo\.php$|^Dockerfile$|^docker-compose.*\.ya?ml$|\.(?:env|ini|log|sql|sql\.gz|bak)$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/(?:docker|\.git)(?:/|$)">
    Require all denied
</DirectoryMatch>

