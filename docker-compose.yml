x-wordpress-environment: &wordpress-environment
  ENV: development
  DB_SERVER: db:3306
  DB_DATABASE: ${DB_DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_TABLE_PREFIX: ${DB_TABLE_PREFIX}
  AUTH_KEY: ${AUTH_KEY}
  SECURE_AUTH_KEY: ${SECURE_AUTH_KEY}
  LOGGED_IN_KEY: ${LOGGED_IN_KEY}
  NONCE_KEY: ${NONCE_KEY}
  AUTH_SALT: ${AUTH_SALT}
  SECURE_AUTH_SALT: ${SECURE_AUTH_SALT}
  LOGGED_IN_SALT: ${LOGGED_IN_SALT}
  NONCE_SALT: ${NONCE_SALT}
  WP_HOME: http://localhost:${DEV_PORT:-8080}
  WP_SITEURL: http://localhost:${DEV_PORT:-8080}
  WP_MEMORY_LIMIT: ${WP_MEMORY_LIMIT:-256M}
  WP_POST_REVISIONS: ${WP_POST_REVISIONS:-10}
  WP_AUTOSAVE_INTERVAL: ${WP_AUTOSAVE_INTERVAL:-60}
  WP_EMPTY_TRASH_DAYS: ${WP_EMPTY_TRASH_DAYS:-30}
  WP_DEBUG: "true"
  WP_DEBUG_LOG: "true"
  WP_DEBUG_DISPLAY: "false"
  WP_DISALLOW_FILE_MODS: "false"
  WP_AUTOMATIC_UPDATER_DISABLED: "false"
  WP_AUTO_UPDATE_CORE: "false"
  FORCE_SSL_ADMIN: "false"
  DISABLE_WP_CRON: "false"
  WP_REDIS_HOST: redis
  WP_REDIS_PORT: "6379"
  WP_REDIS_PREFIX: ${WP_REDIS_PREFIX:-opendoors:}
  WP_REDIS_CLIENT: phpredis
  WP_REDIS_DISABLED: "false"
  OPCACHE_VALIDATE_TIMESTAMPS: "1"
  OPCACHE_REVALIDATE_FREQ: "2"
  REALPATH_CACHE_TTL: "120"
  RECOVERY_MODE_EMAIL: ${RECOVERY_MODE_EMAIL:-admin@example.com}

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0.41}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ${DB_SEED_FILE:-./opendoors.sql.gz}
        target: /docker-entrypoint-initdb.d/001-opendoors.sql.gz
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      # The bundled compressed dump expands to more than 1 GB on first boot.
      start_period: 60m
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  wordpress:
    image: ${WORDPRESS_IMAGE:-opendoors-wordpress:latest}
    build:
      context: .
      args:
        WORDPRESS_BASE_IMAGE: ${WORDPRESS_BASE_IMAGE:-wordpress:php8.3-apache}
    restart: unless-stopped
    environment: *wordpress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
    networks:
      - frontend
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  frontend:
  backend:
    internal: true
